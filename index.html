<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chess — vs. Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  ── Chess vs. Engine ──────────────────────────────────────────────
  Single-file, zero-backend chess app.

  Libraries:
   - chess.js 0.10.3 (loaded from cdnjs) → move generation / game rules
   - stockfish.js 19, pure-JavaScript "asm.js" build → the AI

  IMPORTANT — the engine is NOT loaded from a CDN, and it is NOT
  WebAssembly. Both of those were tried and dropped for real reasons:
   - CDNs: every option tried (jsDelivr, unpkg, GitHub release assets)
     had a dealbreaker for this exact file — package too large to
     serve, or missing CORS headers — so the engine ships as a plain
     file sitting next to this HTML instead: stockfish-19-asm.js.
     Keep it in the same folder wherever you host this (GitHub Pages,
     Netlify, Vercel, or just opening the file locally).
   - WebAssembly: browsers require a site's Content-Security-Policy to
     include 'wasm-unsafe-eval' before WASM is allowed to run at all.
     Since this file may end up hosted somewhere that sets a strict
     CSP outside of our control, the WASM build was swapped for this
     pure-JS "asm.js" build, which still has the same NNUE evaluation
     but never touches eval/WASM — so no CSP setting can block it.
     The trade-off is a slower engine (no WASM/SIMD speedups), which
     is why moves are budgeted by *time* rather than a fixed depth —
     see SEARCH_MOVETIME_MS below.

  This also means zero network dependency for the AI itself — only
  the two Google Fonts above need internet.

  Resilience: if the Stockfish worker ever fails to load (e.g. the
  file wasn't uploaded, or the browser blocks workers entirely) the
  app automatically falls back to a lightweight built-in move-picker
  so the game still works — you'll see a small notice in the sidebar
  when that happens.

  Post-game report: when the game ends, the engine re-scores every
  position that occurred and grades each of your moves by how much
  evaluation you gave up compared to the engine's own assessment.
  That produces an accuracy %, a move-quality breakdown (best / good
  / inaccuracy / mistake / blunder — also shown as dots in the move
  log), and a rough estimated rating band. This is a transparent,
  informal approximation, not an official Elo rating.
-->
<style>
  :root{
    --bg: #12141a;
    --bg-soft: #1a1d25;
    --panel: #f8f6f0;
    --panel-line: #e4e0d4;
    --ink: #21242b;
    --ink-soft: #6b7280;
    --board-light: #ece6d6;
    --board-dark: #4f6a56;
    --board-dark-deep: #3f5646;
    --accent: #b8935a;
    --accent-deep: #97764a;
    --accent-soft: #e9d6ae;
    --good: #5c8264;
    --bad: #ae5b52;
    --panel-alt: #eeece2;
    --q-best: #3d6b47;      --q-best-bg: #e1ede2;
    --q-good: #4c7d4a;      --q-good-bg: #e9f1e4;
    --q-inaccuracy: #93711f; --q-inaccuracy-bg: #f5ecd6;
    --q-mistake: #a15a2f;    --q-mistake-bg: #f6e3d3;
    --q-blunder: #a13a34;    --q-blunder-bg: #f6dbd8;
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-deep: 0 30px 70px -30px rgba(0,0,0,.6);
    --shadow-soft: 0 10px 30px -12px rgba(0,0,0,.35);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
  }

  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #1c2029 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 30%, #191c24 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 28px 16px 60px;
    -webkit-tap-highlight-color: transparent;
  }

  .app{
    width:100%;
    max-width: 1040px;
    display:grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 28px;
    align-items:start;
  }

  @media (max-width: 860px){
    .app{ grid-template-columns: 1fr; }
  }

  /* ---------- header ---------- */
  .masthead{
    grid-column: 1 / -1;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 4px;
    padding: 0 2px;
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 38px);
    color: #f3f1ea;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .masthead p{
    margin: 4px 0 0;
    color: #8890a0;
    font-size: 14px;
  }

  /* ---------- board ---------- */
  .board-wrap{
    position:relative;
    background: linear-gradient(160deg, #2b3f34, #223228);
    padding: 14px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-deep);
  }

  .board{
    position:relative;
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width:100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    overflow:hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }

  .square{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
  }
  .square.light{ background: var(--board-light); }
  .square.dark{ background: var(--board-dark); }

  .square .coord{
    position:absolute;
    font-size: 10px;
    font-weight:600;
    opacity:.45;
    pointer-events:none;
  }
  .square.light .coord{ color: var(--board-dark-deep); }
  .square.dark .coord{ color: var(--board-light); }
  .square .coord.file{ right:4px; bottom:2px; }
  .square .coord.rank{ left:4px; top:2px; }

  .square.selected::before{
    content:"";
    position:absolute; inset:0;
    background: rgba(184,147,90,.55);
    box-shadow: inset 0 0 0 3px var(--accent);
  }
  .square.last-from::before, .square.last-to::before{
    content:"";
    position:absolute; inset:0;
    background: rgba(184,147,90,.28);
  }
  .square.in-check::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle, rgba(196,80,68,.65) 0%, rgba(196,80,68,.15) 70%);
  }

  .square .dot{
    position:absolute;
    top:50%; left:50%;
    width: 24%;
    height:24%;
    margin:0;
    border-radius:50%;
    background: rgba(30,30,30,.28);
    pointer-events:none;
    transform: translate(-50%, -50%);
  }
  .square .ring{
    position:absolute;
    inset: 6%;
    margin:0;
    border-radius:50%;
    box-shadow: inset 0 0 0 5px rgba(30,30,30,.28);
    pointer-events:none;
  }

  .piece{
    font-size: min(9vw, 54px);
    line-height:1;
    transform: translateZ(0);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.25));
    pointer-events:none;
  }
  .piece.white{ color:#f7f4ec; -webkit-text-stroke: 0.5px #2a2a2a; }
  .piece.black{ color:#1c1c1c; }

  /* ---------- promotion picker ---------- */
  .promo-overlay{
    position:absolute; inset:0;
    background: rgba(10,12,16,.55);
    display:flex; align-items:center; justify-content:center;
    z-index: 5;
  }
  .promo-card{
    background: var(--panel);
    border-radius: var(--radius-md);
    padding: 14px;
    display:flex; gap:10px;
    box-shadow: var(--shadow-soft);
  }
  .promo-btn{
    width:56px; height:56px;
    border-radius: var(--radius-sm);
    border:1px solid var(--panel-line);
    background: #fff;
    font-size: 30px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .promo-btn:hover{ transform: translateY(-2px); border-color: var(--accent); }

  /* ---------- sidebar ---------- */
  .sidebar{
    background: var(--panel);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 22px;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }

  .status-badge{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    background: var(--panel-alt, #eeece2);
    font-weight:600;
    font-size: 14.5px;
    color: var(--ink);
    border: 1px solid var(--panel-line);
  }
  .status-badge .dot-indicator{
    width:9px; height:9px; border-radius:50%;
    background: var(--ink-soft);
    flex: none;
  }
  .status-badge.thinking .dot-indicator{
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .status-badge.your-turn .dot-indicator{ background: var(--good); }
  .status-badge.win .dot-indicator{ background: var(--good); }
  .status-badge.lose .dot-indicator{ background: var(--bad); }
  .status-badge.draw .dot-indicator{ background: var(--ink-soft); }
  .status-badge.check .dot-indicator{ background: var(--bad); }

  @keyframes pulse{
    0%,100%{ transform: scale(1); opacity:1; }
    50%{ transform: scale(1.5); opacity:.4; }
  }

  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1;
    padding: 11px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--panel-line);
    background: #fff;
    font-family: 'Inter', sans-serif;
    font-weight:600;
    font-size: 13.5px;
    color: var(--ink);
    cursor:pointer;
    transition: background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .btn:hover{ border-color: var(--accent); }
  .btn:active{ transform: translateY(1px); }
  .btn.primary{
    background: var(--ink);
    color: #fdfbf6;
    border-color: var(--ink);
  }
  .btn.primary:hover{ background: #303540; }

  .divider{ height:1px; background: var(--panel-line); border:none; margin:0; }

  .section-label{
    font-size: 12px;
    font-weight:600;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .movelist{
    flex:1;
    min-height: 120px;
    max-height: 320px;
    overflow-y:auto;
    display:grid;
    grid-template-columns: 28px 1fr 1fr;
    row-gap: 4px;
    column-gap: 6px;
    font-size: 14px;
    padding-right: 4px;
  }
  .movelist::-webkit-scrollbar{ width:6px; }
  .movelist::-webkit-scrollbar-thumb{ background: var(--panel-line); border-radius:6px; }

  .movelist .num{ color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .movelist .mv{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 3px 6px;
    border-radius: 5px;
    font-variant-numeric: tabular-nums;
    min-height: 22px;
  }
  .movelist .mv.current{ background: var(--accent-soft); }
  .movelist .mv .qdot{
    width:6px; height:6px;
    border-radius:50%;
    flex:none;
  }
  .movelist .mv .qdot.q-best{ background: var(--q-best); }
  .movelist .mv .qdot.q-good{ background: var(--q-good); }
  .movelist .mv .qdot.q-inaccuracy{ background: var(--q-inaccuracy); }
  .movelist .mv .qdot.q-mistake{ background: var(--q-mistake); }
  .movelist .mv .qdot.q-blunder{ background: var(--q-blunder); }
  .movelist .empty{
    grid-column: 1 / -1;
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    padding: 6px 2px;
  }

  .engine-note{
    font-size: 12px;
    color: var(--ink-soft);
    line-height:1.5;
  }
  .engine-note.warn{ color: var(--bad); }
  .engine-note b{ color: var(--ink); }

  /* ---------- game over modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(10,12,16,.6);
    display:none;
    align-items:center; justify-content:center;
    z-index: 40;
    padding: 20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-card{
    background: var(--panel);
    border-radius: var(--radius-lg);
    padding: 34px 32px;
    max-width: 380px;
    width:100%;
    max-height: 88vh;
    overflow-y: auto;
    text-align:center;
    box-shadow: var(--shadow-deep);
    animation: pop .22s cubic-bezier(.2,.8,.3,1.2);
  }
  @keyframes pop{
    from{ transform: scale(.9); opacity:0; }
    to{ transform: scale(1); opacity:1; }
  }
  .modal-card h2{
    font-family:'Fraunces', serif;
    font-size: 26px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .modal-card p.modal-text{
    margin: 0 0 20px;
    color: var(--ink-soft);
    font-size: 14.5px;
  }

  /* ---------- game report ---------- */
  .report{
    margin: 0 0 22px;
    padding: 18px 4px 4px;
    border-top: 1px solid var(--panel-line);
  }
  .report-loading{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color: var(--ink-soft);
    font-size: 13.5px;
    padding: 14px 0;
  }
  .spinner{
    width:16px; height:16px;
    border-radius:50%;
    border:2px solid var(--panel-line);
    border-top-color: var(--accent);
    flex:none;
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .report-results{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .report-accuracy{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .accuracy-value{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 42px;
    line-height:1;
    color: var(--ink);
  }
  .accuracy-label{
    font-size: 12px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color: var(--ink-soft);
  }
  .report-rating{
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .report-rating b{ color: var(--ink); }
  .report-breakdown{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
  }
  .chip{
    font-size: 11.5px;
    font-weight:700;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-alt);
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .chip.c-best{ color: var(--q-best); background: var(--q-best-bg); }
  .chip.c-good{ color: var(--q-good); background: var(--q-good-bg); }
  .chip.c-inaccuracy{ color: var(--q-inaccuracy); background: var(--q-inaccuracy-bg); }
  .chip.c-mistake{ color: var(--q-mistake); background: var(--q-mistake-bg); }
  .chip.c-blunder{ color: var(--q-blunder); background: var(--q-blunder-bg); }
  .report-unavailable{
    color: var(--ink-soft);
    font-size: 13px;
    line-height:1.5;
    padding: 8px 0;
  }
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <div>
      <h1>Chess</h1>
      <p>You play White against a full-strength engine.</p>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="sidebar">
    <div class="status-badge your-turn" id="statusBadge">
      <span class="dot-indicator"></span>
      <span id="statusText">Your turn</span>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="newGameBtn">New game</button>
      <button class="btn" id="flipBtn">Flip board</button>
    </div>

    <hr class="divider">

    <div>
      <p class="section-label">Move log</p>
      <div class="movelist" id="movelist">
        <div class="empty">No moves yet — make the first move on the board.</div>
      </div>
    </div>

    <hr class="divider">

    <p class="engine-note" id="engineNote"><b>Loading engine…</b> This can take a few seconds on the first move.</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <h2 id="modalTitle">Checkmate</h2>
    <p class="modal-text" id="modalText">Game over.</p>

    <div class="report" id="reportSection">
      <div class="report-loading" id="reportLoading">
        <span class="spinner"></span>
        <span>Analyzing your moves…</span>
      </div>
      <div class="report-results" id="reportResults" style="display:none;">
        <div class="report-accuracy">
          <span class="accuracy-value" id="accuracyValue">—</span>
          <span class="accuracy-label">Accuracy</span>
        </div>
        <p class="report-rating" id="reportRating">Estimated rating: —</p>
        <div class="report-breakdown" id="reportBreakdown"></div>
      </div>
      <p class="report-unavailable" id="reportUnavailable" style="display:none;"></p>
    </div>

    <button class="btn primary" id="modalNewGameBtn" style="width:100%;">Play again</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.js"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     CONFIG
  ============================================================ */
  // Loaded from the SAME FOLDER as this HTML file — not a CDN.
  // Keep stockfish-19-asm.js sitting right next to this file wherever
  // you host it.
  var STOCKFISH_JS_URL = "stockfish-19-asm.js";
  var SEARCH_MOVETIME_MS = 4000;   // engine "thinking time" per move, in ms.
                                    // A time budget (rather than a fixed depth) is the right
                                    // knob for a pure-JS engine, since raw speed varies a lot
                                    // from phone to phone. Raise this for a stronger but
                                    // slower engine, lower it for snappier but weaker play.
  var ENGINE_INIT_TIMEOUT_MS = 15000;
  var ANALYSIS_MOVETIME_MS = 300;  // per-position budget when scoring the finished game for the report

  var FILES = "abcdefgh";
  var PIECE_GLYPH = {
    p: "♟", n: "♞", b: "♝", r: "♜", q: "♛", k: "♚"
  };

  /* ============================================================
     STATE
  ============================================================ */
  var game = new Chess();
  var orientation = "white";     // "white" | "black" — visual orientation only
  var playerColor = "w";
  var selected = null;           // e.g. "e2"
  var legalTargets = [];         // verbose move objects from selected square
  var lastMove = null;           // {from, to}
  var aiThinking = false;
  var pendingPromotion = null;   // {from, to} awaiting piece choice

  var engineWorker = null;
  var engineReady = false;
  var engineBroken = false;

  var analysisRunning = false;
  var analysisDone = false;
  var moveQualities = {};        // ply index (0-based, matches game.history() order) → quality string

  /* ============================================================
     DOM refs
  ============================================================ */
  var boardEl = document.getElementById("board");
  var statusBadge = document.getElementById("statusBadge");
  var statusText = document.getElementById("statusText");
  var movelistEl = document.getElementById("movelist");
  var engineNoteEl = document.getElementById("engineNote");
  var newGameBtn = document.getElementById("newGameBtn");
  var flipBtn = document.getElementById("flipBtn");
  var modalOverlay = document.getElementById("modalOverlay");
  var modalTitle = document.getElementById("modalTitle");
  var modalText = document.getElementById("modalText");
  var modalNewGameBtn = document.getElementById("modalNewGameBtn");
  var reportLoadingEl = document.getElementById("reportLoading");
  var reportResultsEl = document.getElementById("reportResults");
  var reportUnavailableEl = document.getElementById("reportUnavailable");
  var accuracyValueEl = document.getElementById("accuracyValue");
  var reportRatingEl = document.getElementById("reportRating");
  var reportBreakdownEl = document.getElementById("reportBreakdown");

  /* ============================================================
     BOARD RENDERING
  ============================================================ */
  function displayToBoardIndex(row, col){
    if (orientation === "white") return { r: row, c: col };
    return { r: 7 - row, c: 7 - col };
  }

  function squareName(boardRow, boardCol){
    var file = FILES[boardCol];
    var rank = 8 - boardRow;
    return file + rank;
  }

  function squareEl(square){
    return boardEl.querySelector('[data-square="' + square + '"]');
  }

  function squareCenterOffset(square){
    // returns {row, col} of a square within the *displayed* grid (0..7)
    var file = square[0], rank = parseInt(square[1], 10);
    var boardCol = FILES.indexOf(file);
    var boardRow = 8 - rank;
    if (orientation === "white") return { row: boardRow, col: boardCol };
    return { row: 7 - boardRow, col: 7 - boardCol };
  }

  function buildBoard(){
    boardEl.innerHTML = "";
    var boardState = game.board();

    for (var row = 0; row < 8; row++){
      for (var col = 0; col < 8; col++){
        var idx = displayToBoardIndex(row, col);
        var square = squareName(idx.r, idx.c);
        var isLight = (idx.r + idx.c) % 2 === 0;

        var sq = document.createElement("div");
        sq.className = "square " + (isLight ? "light" : "dark");
        sq.dataset.square = square;
        sq.addEventListener("click", onSquareClick);

        // rank/file coordinate labels on the outer edges
        if (col === 0){
          var rankLbl = document.createElement("span");
          rankLbl.className = "coord rank";
          rankLbl.textContent = square[1];
          sq.appendChild(rankLbl);
        }
        if (row === 7){
          var fileLbl = document.createElement("span");
          fileLbl.className = "coord file";
          fileLbl.textContent = square[0];
          sq.appendChild(fileLbl);
        }

        var piece = boardState[idx.r][idx.c];
        if (piece){
          var span = document.createElement("span");
          span.className = "piece " + (piece.color === "w" ? "white" : "black");
          span.textContent = PIECE_GLYPH[piece.type];
          sq.appendChild(span);
        }

        boardEl.appendChild(sq);
      }
    }

    applyHighlights();
  }

  function applyHighlights(){
    var squares = boardEl.querySelectorAll(".square");
    squares.forEach(function(sq){
      sq.classList.remove("selected", "last-from", "last-to", "in-check");
      var dot = sq.querySelector(".dot");
      if (dot) dot.remove();
      var ring = sq.querySelector(".ring");
      if (ring) ring.remove();
    });

    if (lastMove){
      var fromEl = squareEl(lastMove.from);
      var toEl = squareEl(lastMove.to);
      if (fromEl) fromEl.classList.add("last-from");
      if (toEl) toEl.classList.add("last-to");
    }

    if (selected){
      var selEl = squareEl(selected);
      if (selEl) selEl.classList.add("selected");
      legalTargets.forEach(function(mv){
        var tEl = squareEl(mv.to);
        if (!tEl) return;
        var marker = document.createElement("div");
        marker.className = mv.flags.indexOf("c") !== -1 || mv.flags.indexOf("e") !== -1 ? "ring" : "dot";
        tEl.appendChild(marker);
      });
    }

    if (game.in_check()){
      var kingColor = game.turn();
      var boardState = game.board();
      for (var r = 0; r < 8; r++){
        for (var c = 0; c < 8; c++){
          var p = boardState[r][c];
          if (p && p.type === "k" && p.color === kingColor){
            var kSq = squareName(r, c);
            var kEl = squareEl(kSq);
            if (kEl) kEl.classList.add("in-check");
          }
        }
      }
    }
  }

  function animateSlide(fromSquare, toSquare){
    var toEl = squareEl(toSquare);
    if (!toEl) return;
    var pieceEl = toEl.querySelector(".piece");
    if (!pieceEl) return;

    var cell = boardEl.getBoundingClientRect().width / 8;
    var from = squareCenterOffset(fromSquare);
    var to = squareCenterOffset(toSquare);
    var dx = (from.col - to.col) * cell;
    var dy = (from.row - to.row) * cell;

    pieceEl.style.transition = "none";
    pieceEl.style.transform = "translate(" + dx + "px, " + dy + "px)";
    // force reflow so the browser registers the start position
    // eslint-disable-next-line no-unused-expressions
    pieceEl.offsetHeight;
    pieceEl.style.transition = "transform 180ms cubic-bezier(.2,.7,.3,1)";
    pieceEl.style.transform = "translate(0, 0)";
  }

  /* ============================================================
     MOVE LIST
  ============================================================ */
  function moveCellHtml(san, ply, isCurrent){
    var quality = moveQualities[ply];
    var dot = quality ? '<span class="qdot q-' + quality + '" title="' + quality + '"></span>' : "";
    return '<div class="mv' + (isCurrent ? " current" : "") + '">' + dot + '<span>' + san + '</span></div>';
  }

  function renderMoveList(){
    var history = game.history();
    if (history.length === 0){
      movelistEl.innerHTML = '<div class="empty">No moves yet — make the first move on the board.</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < history.length; i += 2){
      var moveNum = (i / 2) + 1;
      var white = history[i];
      var black = history[i + 1];
      var isLastWhite = i === history.length - 1;
      var isLastBlack = i + 1 === history.length - 1;
      html += '<div class="num">' + moveNum + ".</div>";
      html += moveCellHtml(white, i, isLastWhite);
      html += black ? moveCellHtml(black, i + 1, isLastBlack) : '<div class="mv"></div>';
    }
    movelistEl.innerHTML = html;
    movelistEl.scrollTop = movelistEl.scrollHeight;
  }

  /* ============================================================
     STATUS
  ============================================================ */
  function setStatus(text, kind){
    statusText.textContent = text;
    statusBadge.className = "status-badge" + (kind ? " " + kind : "");
  }

  function refreshStatus(){
    if (game.in_checkmate()){
      var winner = game.turn() === "w" ? "black" : "white";
      setStatus(winner === playerColor ? "Checkmate — you win" : "Checkmate — engine wins", winner === playerColor ? "win" : "lose");
      return;
    }
    if (game.in_stalemate()){ setStatus("Draw — stalemate", "draw"); return; }
    if (game.insufficient_material()){ setStatus("Draw — insufficient material", "draw"); return; }
    if (game.in_threefold_repetition()){ setStatus("Draw — repetition", "draw"); return; }
    if (game.in_draw()){ setStatus("Draw", "draw"); return; }

    if (aiThinking){ setStatus("Engine is thinking…", "thinking"); return; }

    if (game.in_check()){
      setStatus((game.turn() === playerColor ? "You're in check" : "Engine is in check"), "check");
      return;
    }

    setStatus(game.turn() === playerColor ? "Your turn" : "Engine's turn", game.turn() === playerColor ? "your-turn" : "");
  }

  function maybeShowGameOver(){
    if (!game.game_over()) return;
    var title, text;
    if (game.in_checkmate()){
      var winner = game.turn() === "w" ? "Black" : "White";
      var youWon = (winner.toLowerCase().charAt(0) === playerColor);
      title = youWon ? "You win" : "Checkmate";
      text = youWon ? "The engine has been checkmated. Well played." : winner + " delivers checkmate.";
    } else if (game.in_stalemate()){
      title = "Stalemate"; text = "Neither side can move. The game is a draw.";
    } else if (game.insufficient_material()){
      title = "Draw"; text = "Neither side has enough material to force a checkmate.";
    } else if (game.in_threefold_repetition()){
      title = "Draw"; text = "The same position has repeated three times.";
    } else {
      title = "Draw"; text = "The game has ended in a draw.";
    }
    modalTitle.textContent = title;
    modalText.textContent = text;
    modalOverlay.classList.add("show");
    runGameAnalysis();
  }

  /* ============================================================
     INTERACTION
  ============================================================ */
  function onSquareClick(e){
    if (aiThinking || pendingPromotion || game.game_over()) return;
    if (game.turn() !== playerColor) return;

    var square = e.currentTarget.dataset.square;
    var piece = game.get(square);

    if (selected){
      var target = null;
      for (var i = 0; i < legalTargets.length; i++){
        if (legalTargets[i].to === square){ target = legalTargets[i]; break; }
      }
      if (target){
        if (target.flags.indexOf("p") !== -1){
          openPromotionPicker(selected, square);
        } else {
          commitMove(selected, square);
        }
        return;
      }
      if (piece && piece.color === playerColor){
        selectSquare(square);
      } else {
        clearSelection();
        render();
      }
      return;
    }

    if (piece && piece.color === playerColor){
      selectSquare(square);
    }
  }

  function selectSquare(square){
    selected = square;
    legalTargets = game.moves({ square: square, verbose: true });
    applyHighlights();
  }

  function clearSelection(){
    selected = null;
    legalTargets = [];
  }

  function commitMove(from, to, promotion){
    var moveObj = { from: from, to: to };
    if (promotion) moveObj.promotion = promotion;
    var result = game.move(moveObj);
    if (!result) return null;

    clearSelection();
    lastMove = { from: result.from, to: result.to };
    render();
    animateSlide(result.from, result.to);
    renderMoveList();
    refreshStatus();
    maybeShowGameOver();

    if (!game.game_over() && game.turn() !== playerColor){
      window.setTimeout(triggerEngineMove, 260);
    }
    return result;
  }

  /* ---------- promotion picker ---------- */
  function openPromotionPicker(from, to){
    pendingPromotion = { from: from, to: to };
    clearSelection();
    render();

    var toEl = squareEl(to);
    var overlay = document.createElement("div");
    overlay.className = "promo-overlay";
    var card = document.createElement("div");
    card.className = "promo-card";

    var color = game.turn();
    var choices = ["q", "r", "b", "n"];
    choices.forEach(function(type){
      var btn = document.createElement("div");
      btn.className = "promo-btn";
      btn.textContent = PIECE_GLYPH[type];
      btn.style.color = color === "w" ? "#f7f4ec" : "#1c1c1c";
      if (color === "w") btn.style.webkitTextStroke = "0.5px #2a2a2a";
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        var f = pendingPromotion.from, t = pendingPromotion.to;
        pendingPromotion = null;
        commitMove(f, t, type);
      });
      card.appendChild(btn);
    });

    overlay.appendChild(card);
    boardEl.parentElement.appendChild(overlay);
  }

  function closePromotionOverlay(){
    var existing = document.querySelector(".promo-overlay");
    if (existing) existing.remove();
  }

  /* ============================================================
     RENDER (full pass)
  ============================================================ */
  function render(){
    closePromotionOverlay();
    buildBoard();
  }

  /* ============================================================
     ENGINE — Stockfish worker with graceful fallback
  ============================================================ */
  function postToEngine(cmd){
    if (engineWorker) engineWorker.postMessage(cmd);
  }

  function readLine(e){
    return typeof e.data === "string" ? e.data : (e.data && e.data.data) || "";
  }

  // Same-origin load — the engine files sit right next to this HTML
  // file, so there's no CORS or cross-origin Worker restriction to
  // work around here.
  function initEngine(){
    return new Promise(function(resolve){
      var settled = false;
      function finish(ok){
        if (settled) return;
        settled = true;
        resolve(ok);
      }

      try {
        engineWorker = new Worker(STOCKFISH_JS_URL);
      } catch (err){
        finish(false);
        return;
      }

      var timeout = window.setTimeout(function(){ finish(false); }, ENGINE_INIT_TIMEOUT_MS);

      function onMsg(e){
        var line = readLine(e);
        if (line.indexOf("uciok") !== -1){
          postToEngine("setoption name Skill Level value 20");
          postToEngine("setoption name Hash value 32");
          postToEngine("isready");
        } else if (line.indexOf("readyok") !== -1){
          engineWorker.removeEventListener("message", onMsg);
          window.clearTimeout(timeout);
          engineReady = true;
          finish(true);
        }
      }

      engineWorker.addEventListener("message", onMsg);
      engineWorker.addEventListener("error", function(){ window.clearTimeout(timeout); finish(false); });
      postToEngine("uci");
    });
  }

  function getEngineMove(fen){
    return new Promise(function(resolve, reject){
      if (!engineWorker || !engineReady){ reject(new Error("engine unavailable")); return; }
      function onMsg(e){
        var line = readLine(e);
        if (line.indexOf("bestmove") === 0){
          engineWorker.removeEventListener("message", onMsg);
          var parts = line.split(" ");
          resolve(parts[1]);
        }
      }
      engineWorker.addEventListener("message", onMsg);
      postToEngine("position fen " + fen);
      postToEngine("go movetime " + SEARCH_MOVETIME_MS);
    });
  }

  /* ============================================================
     GAME ANALYSIS — post-game accuracy / rating report
     ------------------------------------------------------------
     Method: replay the finished game and get the engine's own
     evaluation of every position that occurred (one short search
     per position, from the side-to-move's perspective). For each
     of the player's moves, compare the evaluation right before the
     move to the evaluation right after it (flipped to the player's
     own perspective) — the drop is that move's "centipawn loss".
     Averaging that loss over the game gives a standard, if informal,
     read on move quality, which is what accuracy% and the estimated
     rating band below are both derived from. This is NOT an official
     Elo rating — no single-game metric can be — it's a rough,
     transparent approximation so the numbers are worth learning from
     rather than worth trusting literally.
  ============================================================ */
  function analyzePosition(fen){
    return new Promise(function(resolve){
      if (!engineWorker || !engineReady){ resolve(null); return; }
      var lastScore = null;
      function onMsg(e){
        var line = readLine(e);
        if (line.indexOf("info") === 0 && line.indexOf(" score ") !== -1){
          var m = /score (cp|mate) (-?\d+)/.exec(line);
          if (m){
            if (m[1] === "cp"){
              lastScore = parseInt(m[2], 10);
            } else {
              var mateIn = parseInt(m[2], 10);
              lastScore = mateIn > 0 ? (100000 - mateIn) : (-100000 - mateIn);
            }
          }
        } else if (line.indexOf("bestmove") === 0){
          engineWorker.removeEventListener("message", onMsg);
          resolve(lastScore);
        }
      }
      engineWorker.addEventListener("message", onMsg);
      postToEngine("position fen " + fen);
      postToEngine("go movetime " + ANALYSIS_MOVETIME_MS);
    });
  }

  function classifyLoss(loss){
    if (loss <= 10) return "best";
    if (loss <= 25) return "good";
    if (loss <= 60) return "inaccuracy";
    if (loss <= 150) return "mistake";
    return "blunder";
  }

  function estimateRatingBand(acpl){
    if (acpl <= 10) return "2400+";
    if (acpl <= 20) return "2200–2400";
    if (acpl <= 35) return "2000–2200";
    if (acpl <= 55) return "1800–2000";
    if (acpl <= 80) return "1600–1800";
    if (acpl <= 120) return "1400–1600";
    if (acpl <= 180) return "1100–1400";
    if (acpl <= 260) return "800–1100";
    return "under 800";
  }

  function chipHtml(label, count, cls){
    return '<span class="chip c-' + cls + '">' + label + " " + count + "</span>";
  }

  function showReportUnavailable(message){
    reportLoadingEl.style.display = "none";
    reportResultsEl.style.display = "none";
    reportUnavailableEl.style.display = "block";
    reportUnavailableEl.textContent = message;
  }

  function finishAnalysis(movers, evals){
    var losses = [];
    var counts = { best: 0, good: 0, inaccuracy: 0, mistake: 0, blunder: 0 };

    for (var k = 0; k < movers.length; k++){
      if (movers[k] !== playerColor) continue;
      var eBefore = evals[k];
      var eAfterRaw = evals[k + 1];
      if (eBefore == null || eAfterRaw == null) continue;
      var eAfter = -eAfterRaw;
      var loss = Math.max(0, eBefore - eAfter);
      var quality = classifyLoss(loss);
      moveQualities[k] = quality;
      counts[quality]++;
      losses.push(loss);
    }

    analysisRunning = false;
    analysisDone = true;

    if (losses.length === 0){
      showReportUnavailable("Not enough moves to analyze.");
      return;
    }

    var acpl = losses.reduce(function(a, b){ return a + b; }, 0) / losses.length;
    var accuracy = Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * acpl) - 3.1669));

    reportLoadingEl.style.display = "none";
    reportUnavailableEl.style.display = "none";
    reportResultsEl.style.display = "flex";
    accuracyValueEl.textContent = accuracy.toFixed(1) + "%";
    reportRatingEl.innerHTML = "Estimated rating band: <b>" + estimateRatingBand(acpl) + "</b>";
    reportBreakdownEl.innerHTML =
      chipHtml("Best", counts.best, "best") +
      chipHtml("Good", counts.good, "good") +
      chipHtml("Inaccuracies", counts.inaccuracy, "inaccuracy") +
      chipHtml("Mistakes", counts.mistake, "mistake") +
      chipHtml("Blunders", counts.blunder, "blunder");

    renderMoveList();
  }

  function runGameAnalysis(){
    if (analysisRunning || analysisDone) return;

    if (!engineReady || engineBroken){
      analysisDone = true;
      showReportUnavailable("Analysis isn't available for this game — the engine wasn't running, so there's nothing to score your moves against.");
      return;
    }

    analysisRunning = true;

    var verboseHistory = game.history({ verbose: true });
    var replay = new Chess();
    var fens = [replay.fen()];
    verboseHistory.forEach(function(m){
      replay.move(m.san);
      fens.push(replay.fen());
    });
    var movers = verboseHistory.map(function(m){ return m.color; });
    var evals = new Array(fens.length).fill(null);

    function step(i){
      if (i >= fens.length){
        finishAnalysis(movers, evals);
        return;
      }
      analyzePosition(fens[i]).then(function(score){
        evals[i] = score;
        step(i + 1);
      });
    }
    step(0);
  }

  /* ---------- fallback move picker (used only if Stockfish can't load) ---------- */
  var PIECE_VALUE = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

  function fallbackMove(){
    var moves = game.moves({ verbose: true });
    if (moves.length === 0) return null;
    var best = null, bestScore = -Infinity;
    moves.forEach(function(m){
      var score = Math.random();
      if (m.captured) score += (PIECE_VALUE[m.captured] || 0) * 10;
      if (m.san && m.san.indexOf("+") !== -1) score += 3;
      if (m.san && m.san.indexOf("#") !== -1) score += 1000;
      if (score > bestScore){ bestScore = score; best = m; }
    });
    return best;
  }

  /* ---------- engine turn ---------- */
  function triggerEngineMove(){
    if (game.game_over() || game.turn() === playerColor) return;
    aiThinking = true;
    refreshStatus();

    var fen = game.fen();

    var movePromise;
    if (engineReady && !engineBroken){
      movePromise = getEngineMove(fen).catch(function(){ return null; });
    } else {
      movePromise = Promise.resolve(null);
    }

    movePromise.then(function(uciMove){
      var result = null;
      if (uciMove && uciMove !== "(none)"){
        var from = uciMove.slice(0, 2);
        var to = uciMove.slice(2, 4);
        var promo = uciMove.length > 4 ? uciMove.slice(4, 5) : undefined;
        result = game.move({ from: from, to: to, promotion: promo || "q" });
      }
      if (!result){
        var fb = fallbackMove();
        if (fb) result = game.move({ from: fb.from, to: fb.to, promotion: fb.promotion });
      }

      aiThinking = false;

      if (result){
        lastMove = { from: result.from, to: result.to };
        render();
        animateSlide(result.from, result.to);
        renderMoveList();
      }
      refreshStatus();
      maybeShowGameOver();
    });
  }

  /* ============================================================
     GAME CONTROLS
  ============================================================ */
  function resetAnalysisState(){
    analysisRunning = false;
    analysisDone = false;
    moveQualities = {};
    reportLoadingEl.style.display = "flex";
    reportResultsEl.style.display = "none";
    reportUnavailableEl.style.display = "none";
  }

  function newGame(){
    game.reset();
    clearSelection();
    lastMove = null;
    aiThinking = false;
    pendingPromotion = null;
    modalOverlay.classList.remove("show");
    resetAnalysisState();
    render();
    renderMoveList();
    refreshStatus();
  }

  function flipBoard(){
    orientation = orientation === "white" ? "black" : "white";
    render();
  }

  newGameBtn.addEventListener("click", newGame);
  modalNewGameBtn.addEventListener("click", newGame);
  flipBtn.addEventListener("click", flipBoard);

  /* ============================================================
     BOOT
  ============================================================ */
  render();
  renderMoveList();
  refreshStatus();

  initEngine().then(function(ok){
    if (ok){
      engineNoteEl.innerHTML = "<b>Engine ready.</b> Thinking for " + (SEARCH_MOVETIME_MS / 1000) + "s per move at full strength.";
      engineNoteEl.classList.remove("warn");
    } else {
      engineBroken = true;
      engineNoteEl.innerHTML = "<b>Engine failed to load.</b> Playing with a lightweight built-in fallback instead — make sure stockfish-19-asm.js is uploaded in the same folder as this page, then reload.";
      engineNoteEl.classList.add("warn");
    }
  });

})();
</script>
</body>
</html>
